name: Build Surf FED Electron App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate built-in extensions
        shell: bash
        run: |
          set -e

          if [ ! -d "extensions/builtin" ]; then
            echo "No builtin extensions folder found."
            exit 0
          fi

          ok=1

          for dir in extensions/builtin/*/; do
            if [ ! -f "${dir}manifest.json" ]; then
              echo "::error::Missing manifest.json in ${dir}"
              ok=0
              continue
            fi

            if ! node -e "JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8'))" 2>/dev/null; then
              echo "::error::Invalid JSON in ${dir}manifest.json"
              ok=0
              continue
            fi

            name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).name || 'unknown')")
            version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).version || '0')")

            echo "OK: ${name} v${version} (${dir})"
          done

          if [ "$ok" != "1" ]; then
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            libavcodec-extra \
            libgbm1 \
            libasound2t64

      - name: Build Windows portable EXE
        if: runner.os == 'Windows'
        run: npm run dist -- --win portable --publish never

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: npm run dist -- --mac --publish never

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: npm run dist -- --linux --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Surf-FED-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into release folder
        shell: bash
        run: |
          set -e

          mkdir -p release

          find artifacts -type f \
            \( \
              -name "*.exe" \
              -o -name "*.dmg" \
              -o -name "*.zip" \
              -o -name "*.AppImage" \
              -o -name "*.deb" \
              -o -name "*.snap" \
              -o -name "latest*.yml" \
            \) \
            -exec cp {} release/ \;

          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Surf FED ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
