name: Build Surf FED Tauri App

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: |
            x86_64-pc-windows-msvc
            x86_64-apple-darwin
            x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Show tool versions
        shell: bash
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate built-in extensions
        shell: bash
        run: |
          set -e

          if [ ! -d "extensions/builtin" ]; then
            echo "No builtin extensions folder found."
            exit 0
          fi

          ok=1

          for dir in extensions/builtin/*/; do
            if [ ! -f "${dir}manifest.json" ]; then
              echo "::error::Missing manifest.json in ${dir}"
              ok=0
              continue
            fi

            if ! node -e "JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8'))" 2>/dev/null; then
              echo "::error::Invalid JSON in ${dir}manifest.json"
              ok=0
              continue
            fi

            name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).name || 'unknown')")
            version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).version || '0')")

            echo "OK: ${name} v${version} (${dir})"
          done

          if [ "$ok" != "1" ]; then
            exit 1
          fi

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli

      - name: Verify Tauri CLI
        shell: bash
        run: npx tauri --version

      - name: Build Tauri application
        run: npm run tauri build

      - name: Show generated files
        shell: bash
        run: |
          set -e

          if [ ! -d "src-tauri/target/release/bundle" ]; then
            echo "::error::No Tauri bundle directory was generated."
            exit 1
          fi

          echo "Generated files:"
          find src-tauri/target/release/bundle -type f -print

          if [ -z "$(find src-tauri/target/release/bundle -type f -print -quit)" ]; then
            echo "::error::The Tauri bundle directory is empty."
            exit 1
          fi

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Surf-FED-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Surf-FED-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Surf-FED-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into release folder
        shell: bash
        run: |
          set -e

          mkdir -p release

          find artifacts -type f \
            \( \
              -name "*.msi" \
              -o -name "*.exe" \
              -o -name "*.dmg" \
              -o -name "*.app.tar.gz" \
              -o -name "*.AppImage" \
              -o -name "*.deb" \
              -o -name "*.rpm" \
            \) \
            -exec cp {} release/ \;

          echo "Release files:"
          ls -la release

          if [ -z "$(find release -type f -print -quit)" ]; then
            echo "::error::No release files were found."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Surf FED ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
