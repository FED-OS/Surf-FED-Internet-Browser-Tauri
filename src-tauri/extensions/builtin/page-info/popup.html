<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 12px;
      background: #1e1e1e;
      color: #e8e8e8;
    }
    h3 { margin: 0 0 8px; font-size: 14px; }
    .row { margin-bottom: 6px; font-size: 12px; word-break: break-word; }
    .label { color: #8ab4f8; font-weight: 600; }
    .value { color: #ddd; }
    a { color: #8ab4f8; }
  </style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <h3>🧩 Page Info</h3>
  <div class="row"><span class="label">Title:</span> <span class="value" id="title">—</span></div>
  <div class="row"><span class="label">URL:</span> <span class="value" id="url">—</span></div>
  <div class="row"><span class="label">Description:</span> <span class="value" id="desc">—</span></div>
  <div class="row"><span class="label">Links:</span> <span class="value" id="links">—</span></div>
  <div class="row"><span class="label">Images:</span> <span class="value" id="images">—</span></div>
  <script src="popup.js"></script>
</body>
</html>
