[package]
name = "surf-fed"
version = "2.0.0"
description = "Surf FED - a Tauri-based web browser with native extension support"
authors = ["Surf FED Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "surf_fed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
scraper = "0.20"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"

[features]
custom-protocol = ["tauri/custom-protocol"]
